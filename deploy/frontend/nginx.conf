# Example nginx sites for the three web apps (static files built by deploy/frontend/update.sh).
# Copy to /etc/nginx/sites-available/delivez-frontend, change server_name and the /var/www/... paths to where
# the repo is cloned, enable it, then add HTTPS:  sudo certbot --nginx -d partners.delivez.com -d partners.admin.delivez.com -d local.delivez.com

server {
  listen 80;
  server_name partners.delivez.com;
  root /var/www/delivez-partners-frontend/apps/partners-web/dist;

  # Push-alert service worker must never be cached.
  location = /push-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # Hashed build files can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # Single-page app: every other path loads index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

server {
  listen 80;
  server_name partners.admin.delivez.com;
  root /var/www/delivez-partners-frontend/apps/admin-web/dist;

  location = /push-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

# Customer app (Delivez Local). Change local.delivez.com to the customer domain you choose.
server {
  listen 80;
  server_name local.delivez.com;
  root /var/www/delivez-partners-frontend/apps/local-web/dist;

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
