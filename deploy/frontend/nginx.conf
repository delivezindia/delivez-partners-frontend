# Static hosting only — the apps call the API directly at VITE_API_URL (set at build time).
# Partners app on :8080, Admin console on :8081. Put HTTPS in front (partners.<domain> → :8080, admin.<domain> → :8081).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/partners;

  # Push-alert service worker must never be cached.
  location = /push-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # Hashed build files can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # Single-page app: every other path loads index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/admin;

  location = /push-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
