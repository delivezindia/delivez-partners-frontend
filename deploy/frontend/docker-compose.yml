# FRONTEND server: Partners app (:8080) + Admin console (:8081).
#   cd deploy/frontend && cp .env.example .env   (set VITE_API_URL)
#   docker compose up -d --build
name: delivez-frontend

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in deploy/frontend/.env}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - "8080:8080" # Partners app
      - "8081:8081" # Admin console
